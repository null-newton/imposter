name: imp-meeting-room
services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PORT: "5173"
      DATA_DIR: /app/data
    volumes:
      - lobby-data:/app/data
    expose:
      - "5173"
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  lobby-data:
  caddy-data:
  caddy-config:
